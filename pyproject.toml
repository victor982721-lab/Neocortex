[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "neocortex-framework"
dynamic = ["version"]
description = "Windows-first incremental personal content framework"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mypy>=2.1,<3",
    "rich>=15,<16",
    "ruff>=0.15,<0.16",
    "xxhash>=3.8,<4",
]

[project.scripts]
Neocortex = "neocortex.cli:entrypoint"

[project.optional-dependencies]
documents = [
    "Pillow>=12.2,<13",
    "PyMuPDF>=1.27,<2",
    "pdfminer.six>=20260107",
    "pytesseract>=0.3.13,<0.4",
]
audio = [
    "faster-whisper>=1.2,<2",
]
image = [
    "nudenet>=3.4.2,<4",
    "Pillow>=12.2,<13",
]
semantic = [
    "fastembed==0.8.0",
    "numpy>=2.1,<3",
    "Pillow>=12.2,<13",
]
ui = [
    "PySide6>=6.11,<7",
]
full = [
    "fastembed==0.8.0",
    "faster-whisper>=1.2,<2",
    "nudenet>=3.4.2,<4",
    "numpy>=2.1,<3",
    "Pillow>=12.2,<13",
    "PyMuPDF>=1.27,<2",
    "pdfminer.six>=20260107",
    "PySide6>=6.11,<7",
    "pytesseract>=0.3.13,<0.4",
]
dev = [
    "build>=1.5,<2",
    "coverage>=7.14,<8",
    "pytest>=9.1,<10",
    "vulture>=2.16,<3",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
# Trusted analysis adds bug-prone and maintainability checks without turning
# import order, formatting, pytest style or modernization churn into findings.
# The protected provider continues to use only E4/E7/E9/F.
select = ["E4", "E7", "E9", "F", "B", "C4", "PIE", "RUF"]
ignore = [
    "RUF012", # Mutable ClassVar annotations require a separate typing migration.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
show_error_codes = true
show_column_numbers = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
exclude = "(?x)(^|/)(build|dist|node_modules|\\.venv|\\.mypy_cache|\\.pytest_cache|\\.ruff_cache)/"

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
reportUnusedFunction = "warning"
reportUnusedClass = "warning"
reportImportCycles = "warning"

[tool.setuptools]
py-modules = ["Orquestador"]

[tool.setuptools.dynamic]
version = {attr = "neocortex.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = [
    "neocortex*",
    "_01_Enumeracion*",
    "_02_Deduplicacion*",
    "_03_Progreso*",
    "_04_Nucleo_Operativo*",
    "_05_Interfaz*",
]

[tool.setuptools.package-data]
"neocortex" = ["py.typed"]
"_04_Nucleo_Operativo" = ["py.typed"]
"_05_Interfaz" = ["assets/*.svg", "assets/*.png", "assets/*.ico"]
