name: One-time contract repair

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/release-quality-gates'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact contract repairs
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact match, found {count}")
              target.write_text(source.replace(old, new), encoding="utf-8", newline="\n")

          replace_once(
              "tests/test_dependency_capabilities.py",
              '''DEV_DEPENDENCIES = (
              "build>=1.5,<2",
              "coverage>=7.14,<8",
              "mypy>=2.1,<3",
              "pytest>=9.1,<10",
              "ruff>=0.15,<0.16",
              "vulture>=2.16,<3",
          )'''.replace("          ", ""),
              '''DEV_DEPENDENCIES = (
              "build>=1.5,<2",
              "coverage>=7.14,<8",
              "mypy>=2.1,<3",
              "pytest>=9.1,<10",
              "radon>=6,<7",
              "ruff>=0.15,<0.16",
              "vulture>=2.16,<3",
          )'''.replace("          ", ""),
          )

          replace_once(
              "_04_Nucleo_Operativo/knowledge_search_code.py",
              '''"""Code-owner retrieval support for the Knowledge Search facade.
          # region [00] Contexto del módulo
          # Módulo: _04_Nucleo_Operativo/knowledge_search_code.py
          # Propósito: documentación embebida y separación visual de regiones.
          # endregion [00]


          Facade seams'''.replace("          ", ""),
              '''"""Code-owner retrieval support for the Knowledge Search facade.

          Facade seams'''.replace("          ", ""),
          )
          replace_once(
              "_04_Nucleo_Operativo/knowledge_search_code.py",
              "# region [01] Dependencias del módulo\n",
              "",
          )
          replace_once(
              "_04_Nucleo_Operativo/knowledge_search_code.py",
              "# endregion [01]\n\n# region [02] Implementación\n",
              "",
          )
          replace_once(
              "_04_Nucleo_Operativo/knowledge_search_code.py",
              "# endregion [02]\n",
              "",
          )

          replace_once(
              "_04_Nucleo_Operativo/knowledge_search_inventory.py",
              '''"""Inventory relationship support for the Knowledge Search facade."""
          # region [00] Contexto del módulo
          # Módulo: _04_Nucleo_Operativo/knowledge_search_inventory.py
          # Propósito: documentación embebida y separación visual de regiones.
          # endregion [00]


          '''.replace("          ", ""),
              '''"""Inventory relationship support for the Knowledge Search facade."""

          '''.replace("          ", ""),
          )
          replace_once(
              "_04_Nucleo_Operativo/knowledge_search_inventory.py",
              "# region [01] Dependencias del módulo\n",
              "",
          )
          replace_once(
              "_04_Nucleo_Operativo/knowledge_search_inventory.py",
              "# endregion [01]\n\n# region [02] Implementación\n",
              "",
          )
          replace_once(
              "_04_Nucleo_Operativo/knowledge_search_inventory.py",
              "# endregion [02]\n",
              "",
          )

          expected_lines = {
              "_04_Nucleo_Operativo/knowledge_search_code.py": 897,
              "_04_Nucleo_Operativo/knowledge_search_inventory.py": 900,
          }
          for path, expected in expected_lines.items():
              observed = len(Path(path).read_text(encoding="utf-8").splitlines())
              if observed != expected:
                  raise RuntimeError(f"{path}: expected {expected} lines, found {observed}")
          '@ | python -

      - name: Commit the bounded repair
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/test_dependency_capabilities.py _04_Nucleo_Operativo/knowledge_search_code.py _04_Nucleo_Operativo/knowledge_search_inventory.py
          git commit -m "test: restore dependency and module-size contracts"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
